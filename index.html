<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f7f7">
    <link rel="manifest" href="./manifest.json">

    <title>Bierverkostung</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #f7f7f7;
        }

        h1 {
            text-align: center;
            font-size: 28px;
        }

        h2 {
            margin-top: 25px;
        }

        input,
        textarea {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 6px 0 14px 0;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            padding: 11px 15px;
            margin: 5px 3px;
            font-size: 16px;
            border: 1px solid #888;
            border-radius: 6px;
            background: white;
            cursor: pointer;
        }

        button:hover {
            background: #eee;
        }

        #loginBereich {
            max-width: 450px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        #appBereich {
            max-width: 1200px;
            margin: auto;
        }

        #benutzerInfo {
            text-align: right;
            margin-bottom: 15px;
        }

        #loginNachricht {
            font-weight: bold;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
            background: white;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 8px;
            text-align: center;
            white-space: nowrap;
        }

        th {
            background: #eee;
        }

        .gesamt {
            font-weight: bold;
        }

        .notizenZelle {
            white-space: normal;
            text-align: left;
            min-width: 200px;
            max-width: 350px;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 20px;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }

            th,
            td {
                padding: 7px;
                font-size: 14px;
            }

            button {
                font-size: 15px;
            }

            #benutzerInfo {
                text-align: center;
            }

            textarea {
                min-height: 140px;
            }
        }
    </style>

    <script type="module">
        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

        import {
            getFirestore,
            collection,
            addDoc,
            getDocs,
            updateDoc,
            deleteDoc,
            doc
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUSYxVSGNUmqYAy4i8crS1VRGL8nOo_d0",
            authDomain: "bierverkostung.firebaseapp.com",
            projectId: "bierverkostung",
            storageBucket: "bierverkostung.firebasestorage.app",
            messagingSenderId: "869623121454",
            appId: "1:869623121454:web:9c896e7d3b5984db8941bf"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDB = db;

        window.firebaseCreateUser =
            createUserWithEmailAndPassword;

        window.firebaseSignIn =
            signInWithEmailAndPassword;

        window.firebaseSignOut =
            signOut;

        window.firebaseOnAuthStateChanged =
            onAuthStateChanged;

        window.firebaseCollection =
            collection;

        window.firebaseAddDoc =
            addDoc;

        window.firebaseGetDocs =
            getDocs;

        window.firebaseUpdateDoc =
            updateDoc;

        window.firebaseDeleteDoc =
            deleteDoc;

        window.firebaseDoc =
            doc;

        window.dispatchEvent(
            new Event("firebaseReady")
        );
    </script>
</head>

<body>

    <!-- LOGIN -->

    <div id="loginBereich">

        <h1>🍺 Bierverkostung</h1>

        <h2>Anmelden</h2>

        <input
            type="email"
            id="email"
            placeholder="E-Mail-Adresse"
            autocomplete="email"
        >

        <input
            type="password"
            id="passwort"
            placeholder="Passwort"
            autocomplete="current-password"
        >

        <button onclick="anmelden()">
            🔑 Anmelden
        </button>

        <button onclick="registrieren()">
            👤 Konto erstellen
        </button>

        <p id="loginNachricht"></p>

    </div>


    <!-- APP -->

    <div id="appBereich" style="display:none;">

        <div id="benutzerInfo">

            <span id="angemeldeterBenutzer"></span>

            <button onclick="abmelden()">
                🚪 Abmelden
            </button>

        </div>


        <h1>🍺 Bierverkostung</h1>


        <h2 id="formularTitel">
            Neues Bier bewerten
        </h2>


        <label>Bier:</label>

        <input
            type="text"
            id="biername"
            placeholder="Name des Bieres"
        >


        <label>Farbe:</label>

        <input
            type="number"
            id="farbe"
            min="0"
            max="10"
        >


        <label>Etikett:</label>

        <input
            type="number"
            id="etikett"
            min="0"
            max="10"
        >


        <label>Schaum:</label>

        <input
            type="number"
            id="schaum"
            min="0"
            max="10"
        >


        <label>Geruch:</label>

        <input
            type="number"
            id="geruch"
            min="0"
            max="10"
        >


        <label>Süffigkeit:</label>

        <input
            type="number"
            id="sueffigkeit"
            min="0"
            max="10"
        >


        <label>Geschmack:</label>

        <input
            type="number"
            id="geschmack"
            min="0"
            max="10"
        >


        <label>Notizen:</label>

        <textarea
            id="notizen"
            placeholder="Deine persönlichen Notizen zum Bier..."
        ></textarea>


        <br>


        <button onclick="bierSpeichern()">
            🍺 Bier speichern
        </button>


        <button
            onclick="abbrechenBearbeiten()"
            id="abbrechenButton"
            style="display:none;"
        >
            Bearbeiten abbrechen
        </button>


        <h2>Meine Biere</h2>


        <table>

            <thead>

                <tr>
                    <th>Nr.</th>
                    <th>Bier</th>
                    <th>Farbe</th>
                    <th>Etikett</th>
                    <th>Schaum</th>
                    <th>Geruch</th>
                    <th>Süffigkeit</th>
                    <th>Geschmack</th>
                    <th>Notizen</th>
                    <th>Gesamt</th>
                    <th>Aktion</th>
                </tr>

            </thead>

            <tbody id="bierliste"></tbody>

        </table>

    </div>


    <script>

        let biere = [];

        let bearbeitungsIndex = -1;

        let aktuellerBenutzer = null;


        // ==============================
        // REGISTRIEREN
        // ==============================

        function registrieren() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const passwort =
                document
                    .getElementById("passwort")
                    .value;

            const nachricht =
                document
                    .getElementById("loginNachricht");


            if (email === "" || passwort === "") {

                nachricht.innerText =
                    "Bitte E-Mail und Passwort eingeben.";

                return;
            }


            if (passwort.length < 6) {

                nachricht.innerText =
                    "Das Passwort muss mindestens 6 Zeichen haben.";

                return;
            }


            nachricht.innerText =
                "Konto wird erstellt...";


            window.firebaseCreateUser(
                window.firebaseAuth,
                email,
                passwort
            )

            .then(() => {

                nachricht.innerText =
                    "Konto erfolgreich erstellt!";

            })

            .catch((error) => {

                console.error(error);


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    nachricht.innerText =
                        "Diese E-Mail-Adresse ist bereits registriert.";

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    nachricht.innerText =
                        "Die E-Mail-Adresse ist ungültig.";

                }

                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    nachricht.innerText =
                        "Das Passwort ist zu schwach.";

                }

                else {

                    nachricht.innerText =
                        "Fehler: " +
                        error.message;

                }

            });

        }


        // ==============================
        // ANMELDEN
        // ==============================

        function anmelden() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const passwort =
                document
                    .getElementById("passwort")
                    .value;

            const nachricht =
                document
                    .getElementById("loginNachricht");


            if (email === "" || passwort === "") {

                nachricht.innerText =
                    "Bitte E-Mail und Passwort eingeben.";

                return;
            }


            nachricht.innerText =
                "Anmeldung läuft...";


            window.firebaseSignIn(
                window.firebaseAuth,
                email,
                passwort
            )

            .then(() => {

                nachricht.innerText = "";

            })

            .catch((error) => {

                console.error(error);


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    nachricht.innerText =
                        "E-Mail oder Passwort ist falsch.";

                }

                else {

                    nachricht.innerText =
                        "Fehler: " +
                        error.message;

                }

            });

        }


        // ==============================
        // ABMELDEN
        // ==============================

        function abmelden() {

            window.firebaseSignOut(
                window.firebaseAuth
            );

        }


        // ==============================
        // BENUTZERSTATUS
        // ==============================

        function benutzerStatusStarten() {

            window.firebaseOnAuthStateChanged(

                window.firebaseAuth,

                async (user) => {

                    if (user) {

                        aktuellerBenutzer =
                            user;


                        document
                            .getElementById(
                                "loginBereich"
                            )
                            .style.display =
                            "none";


                        document
                            .getElementById(
                                "appBereich"
                            )
                            .style.display =
                            "block";


                        document
                            .getElementById(
                                "angemeldeterBenutzer"
                            )
                            .innerText =
                            "Angemeldet als: " +
                            user.email;


                        await ladeBiere();

                    }

                    else {

                        aktuellerBenutzer =
                            null;

                        biere = [];


                        document
                            .getElementById(
                                "loginBereich"
                            )
                            .style.display =
                            "block";


                        document
                            .getElementById(
                                "appBereich"
                            )
                            .style.display =
                            "none";

                    }

                }

            );

        }


        // ==============================
        // FIRESTORE-PFAD
        // ==============================

        function bierSammlung() {

            return window.firebaseCollection(

                window.firebaseDB,

                "users",

                aktuellerBenutzer.uid,

                "biere"

            );

        }


        // ==============================
        // BIERE LADEN
        // ==============================

        async function ladeBiere() {

            try {

                const snapshot =
                    await window.firebaseGetDocs(
                        bierSammlung()
                    );


                biere = [];


                snapshot.forEach(

                    (documentSnapshot) => {

                        biere.push({

                            id:
                                documentSnapshot.id,

                            ...documentSnapshot.data()

                        });

                    }

                );


                anzeigen();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Die Biere konnten nicht geladen werden."
                );

            }

        }


        // ==============================
        // BIER SPEICHERN
        // ==============================

        async function bierSpeichern() {

            const name =
                document
                    .getElementById("biername")
                    .value
                    .trim();


            if (name === "") {

                alert(
                    "Bitte ein Bier eingeben."
                );

                return;
            }


            const farbe =
                Number(
                    document
                        .getElementById("farbe")
                        .value
                );


            const etikett =
                Number(
                    document
                        .getElementById("etikett")
                        .value
                );


            const schaum =
                Number(
                    document
                        .getElementById("schaum")
                        .value
                );


            const geruch =
                Number(
                    document
                        .getElementById("geruch")
                        .value
                );


            const sueffigkeit =
                Number(
                    document
                        .getElementById("sueffigkeit")
                        .value
                );


            const geschmack =
                Number(
                    document
                        .getElementById("geschmack")
                        .value
                );


            const notizen =
                document
                    .getElementById("notizen")
                    .value
                    .trim();


            const gesamt =
                farbe +
                etikett +
                schaum +
                geruch +
                sueffigkeit +
                geschmack;


            const bier = {

                name: name,

                farbe: farbe,

                etikett: etikett,

                schaum: schaum,

                geruch: geruch,

                sueffigkeit: sueffigkeit,

                geschmack: geschmack,

                notizen: notizen,

                gesamt: gesamt

            };


            try {

                if (bearbeitungsIndex === -1) {

                    await window.firebaseAddDoc(

                        bierSammlung(),

                        bier

                    );

                }

                else {

                    const bierId =
                        biere[
                            bearbeitungsIndex
                        ].id;


                    const bierDokument =
                        window.firebaseDoc(

                            window.firebaseDB,

                            "users",

                            aktuellerBenutzer.uid,

                            "biere",

                            bierId

                        );


                    await window.firebaseUpdateDoc(

                        bierDokument,

                        bier

                    );


                    bearbeitungsIndex =
                        -1;


                    document
                        .getElementById(
                            "formularTitel"
                        )
                        .innerText =
                        "Neues Bier bewerten";


                    document
                        .getElementById(
                            "abbrechenButton"
                        )
                        .style.display =
                        "none";

                }


                formularLeeren();

                await ladeBiere();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Das Bier konnte nicht gespeichert werden."
                );

            }

        }


        // ==============================
        // ANZEIGEN
        // ==============================

        function anzeigen() {

            const liste =
                document
                    .getElementById(
                        "bierliste"
                    );


            liste.innerHTML = "";


            biere.forEach(

                (bier, index) => {

                    const zeile =
                        document.createElement(
                            "tr"
                        );


                    zeile.innerHTML = `

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${bier.name}
                        </td>

                        <td>
                            ${bier.farbe}
                        </td>

                        <td>
                            ${bier.etikett}
                        </td>

                        <td>
                            ${bier.schaum}
                        </td>

                        <td>
                            ${bier.geruch}
                        </td>

                        <td>
                            ${bier.sueffigkeit}
                        </td>

                        <td>
                            ${bier.geschmack}
                        </td>

                        <td class="notizenZelle">
                            ${bier.notizen || ""}
                        </td>

                        <td class="gesamt">
                            ${bier.gesamt}
                        </td>

                        <td>

                            <button
                                onclick="bierBearbeiten(${index})"
                            >
                                ✏️
                            </button>

                            <button
                                onclick="bierLoeschen(${index})"
                            >
                                🗑️
                            </button>

                        </td>

                    `;


                    liste.appendChild(
                        zeile
                    );

                }

            );

        }


        // ==============================
        // BEARBEITEN
        // ==============================

        function bierBearbeiten(index) {

            const bier =
                biere[index];


            document
                .getElementById("biername")
                .value =
                bier.name || "";


            document
                .getElementById("farbe")
                .value =
                bier.farbe ?? "";


            document
                .getElementById("etikett")
                .value =
                bier.etikett ?? "";


            document
                .getElementById("schaum")
                .value =
                bier.schaum ?? "";


            document
                .getElementById("geruch")
                .value =
                bier.geruch ?? "";


            document
                .getElementById("sueffigkeit")
                .value =
                bier.sueffigkeit ?? "";


            document
                .getElementById("geschmack")
                .value =
                bier.geschmack ?? "";


            document
                .getElementById("notizen")
                .value =
                bier.notizen || "";


            bearbeitungsIndex =
                index;


            document
                .getElementById(
                    "formularTitel"
                )
                .innerText =
                "Bier bearbeiten";


            document
                .getElementById(
                    "abbrechenButton"
                )
                .style.display =
                "inline-block";

        }


        // ==============================
        // LÖSCHEN
        // ==============================

        async function bierLoeschen(index) {

            const bestaetigung =
                confirm(
                    "Dieses Bier wirklich löschen?"
                );


            if (!bestaetigung) {

                return;

            }


            try {

                const bierId =
                    biere[index].id;


                const bierDokument =
                    window.firebaseDoc(

                        window.firebaseDB,

                        "users",

                        aktuellerBenutzer.uid,

                        "biere",

                        bierId

                    );


                await window.firebaseDeleteDoc(

                    bierDokument

                );


                await ladeBiere();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Das Bier konnte nicht gelöscht werden."
                );

            }

        }


        // ==============================
        // BEARBEITEN ABBRECHEN
        // ==============================

        function abbrechenBearbeiten() {

            bearbeitungsIndex =
                -1;


            formularLeeren();


            document
                .getElementById(
                    "formularTitel"
                )
                .innerText =
                "Neues Bier bewerten";


            document
                .getElementById(
                    "abbrechenButton"
                )
                .style.display =
                "none";

        }


        // ==============================
        // FORMULAR LEEREN
        // ==============================

        function formularLeeren() {

            document
                .getElementById(
                    "biername"
                )
                .value = "";


            document
                .getElementById(
                    "farbe"
                )
                .value = "";


            document
                .getElementById(
                    "etikett"
                )
                .value = "";


            document
                .getElementById(
                    "schaum"
                )
                .value = "";


            document
                .getElementById(
                    "geruch"
                )
                .value = "";


            document
                .getElementById(
                    "sueffigkeit"
                )
                .value = "";


            document
                .getElementById(
                    "geschmack"
                )
                .value = "";


            document
                .getElementById(
                    "notizen"
                )
                .value = "";

        }


        // ==============================
        // SERVICE WORKER
        // ==============================

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker.register(
                        "./sw.js"
                    )

                    .then(() => {

                        console.log(
                            "Service Worker erfolgreich registriert."
                        );

                    })

                    .catch((error) => {

                        console.error(
                            "Service Worker Fehler:",
                            error
                        );

                    });

                }
            );

        }


        // ==============================
        // FIREBASE STARTEN
        // ==============================

        window.addEventListener(

            "firebaseReady",

            () => {

                benutzerStatusStarten();

            }

        );

    </script>

</body>
</html>
