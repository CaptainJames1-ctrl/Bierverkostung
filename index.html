<script>


let biere = [];

let bearbeitungsIndex = -1;

let aktuellerBenutzer = null;

let aktuellesFoto = null;


/* ==============================
REGISTRIEREN
============================== */

function registrieren() {

const email =
    document
        .getElementById("email")
        .value
        .trim();

const passwort =
    document
        .getElementById("passwort")
        .value;

const nachricht =
    document
        .getElementById("loginNachricht");


if (email === "" || passwort === "") {

nachricht.innerText =
    "Bitte E-Mail und Passwort eingeben.";

return;

}


if (passwort.length < 6) {

nachricht.innerText =
    "Das Passwort muss mindestens 6 Zeichen haben.";

return;

}


nachricht.innerText =
    "Konto wird erstellt...";


window.firebaseCreateUser(
    window.firebaseAuth,
    email,
    passwort
)

.then(() => {

nachricht.innerText =
    "Konto erfolgreich erstellt!";

})

.catch((error) => {

console.error(error);

if (
    error.code ===
    "auth/email-already-in-use"
) {

nachricht.innerText =
    "Diese E-Mail-Adresse ist bereits registriert.";

}

else if (
    error.code ===
    "auth/invalid-email"
) {

nachricht.innerText =
    "Die E-Mail-Adresse ist ungültig.";

}

else if (
    error.code ===
    "auth/weak-password"
) {

nachricht.innerText =
    "Das Passwort ist zu schwach.";

}

else {

nachricht.innerText =
    "Fehler: " +
    error.message;

}

});

}


/* ==============================
ANMELDEN
============================== */

function anmelden() {

const email =
    document
        .getElementById("email")
        .value
        .trim();

const passwort =
    document
        .getElementById("passwort")
        .value;

const nachricht =
    document
        .getElementById("loginNachricht");


if (email === "" || passwort === "") {

nachricht.innerText =
    "Bitte E-Mail und Passwort eingeben.";

return;

}


nachricht.innerText =
    "Anmeldung läuft...";


window.firebaseSignIn(
    window.firebaseAuth,
    email,
    passwort
)

.then(() => {

nachricht.innerText = "";

})

.catch((error) => {

console.error(error);

if (
    error.code ===
    "auth/invalid-credential"
) {

nachricht.innerText =
    "E-Mail oder Passwort ist falsch.";

}

else {

nachricht.innerText =
    "Fehler: " +
    error.message;

}

});

}


/* ==============================
ABMELDEN
============================== */

function abmelden() {

window.firebaseSignOut(
    window.firebaseAuth
);

}


/* ==============================
BENUTZERSTATUS
============================== */

function benutzerStatusStarten() {

window.firebaseOnAuthStateChanged(

window.firebaseAuth,

async (user) => {

if (user) {

aktuellerBenutzer =
    user;


document
    .getElementById("loginBereich")
    .style.display =
    "none";


document
    .getElementById("appBereich")
    .style.display =
    "block";


document
    .getElementById(
        "angemeldeterBenutzer"
    )
    .innerText =
    "Angemeldet als: " +
    user.email;


await ladeBiere();

}

else {

aktuellerBenutzer =
    null;

biere = [];

aktuellesFoto = null;


document
    .getElementById("loginBereich")
    .style.display =
    "block";


document
    .getElementById("appBereich")
    .style.display =
    "none";

}

}

);

}


/* ==============================
FIRESTORE PFAD
============================== */

function bierSammlung() {

return window.firebaseCollection(

window.firebaseDB,

"users",

aktuellerBenutzer.uid,

"biere"

);

}


/* ==============================
BIERE LADEN
============================== */

async function ladeBiere() {

try {

const snapshot =
    await window.firebaseGetDocs(
        bierSammlung()
    );


biere = [];


snapshot.forEach(
    (documentSnapshot) => {

        biere.push({

            id:
                documentSnapshot.id,

            ...documentSnapshot.data()

        });

    }
);


biere.sort(
    (a, b) =>
        (a.erstelltAm || 0) -
        (b.erstelltAm || 0)
);


listeFiltern();

}

catch (error) {

console.error(error);

alert(
    "Die Biere konnten nicht geladen werden."
);

}

}


/* ==============================
FOTO KOMPRIMIEREN
============================== */

function komprimiereBild(file) {

return new Promise((resolve, reject) => {

const reader =
    new FileReader();


reader.onload =
    function(event) {

        const img =
            new Image();


        img.onload =
            function() {

                const MAX_BREITE =
                    900;


                let breite =
                    img.width;

                let hoehe =
                    img.height;


                if (
                    breite >
                    MAX_BREITE
                ) {

                    hoehe =
                        hoehe *
                        MAX_BREITE /
                        breite;

                    breite =
                        MAX_BREITE;

                }


                const canvas =
                    document.createElement(
                        "canvas"
                    );


                canvas.width =
                    breite;

                canvas.height =
                    hoehe;


                const ctx =
                    canvas.getContext(
                        "2d"
                    );


                ctx.drawImage(
                    img,
                    0,
                    0,
                    breite,
                    hoehe
                );


                canvas.toBlob(

                    function(blob) {

                        if (!blob) {

                            reject(
                                new Error(
                                    "Bild konnte nicht komprimiert werden."
                                )
                            );

                            return;

                        }


                        const reader2 =
                            new FileReader();


                        reader2.onload =
                            function() {

                                resolve(
                                    reader2.result
                                );

                            };


                        reader2.onerror =
                            reject;


                        reader2.readAsDataURL(
                            blob
                        );

                    },

                    "image/jpeg",

                    0.65

                );

            };


        img.onerror =
            reject;


        img.src =
            event.target.result;

    };


reader.onerror =
    reject;


reader.readAsDataURL(file);

});


}


/* ==============================
FOTO AUSGEWÄHLT
============================== */

async function fotoAusgewaehlt(event) {

const file =
    event.target.files[0];


if (!file) {
    return;
}


if (
    !file.type.startsWith("image/")
) {

alert(
    "Bitte eine Bilddatei auswählen."
);

event.target.value = "";

return;

}


try {

aktuellesFoto =
    await komprimiereBild(file);


const vorschau =
    document.getElementById(
        "fotoVorschau"
    );


vorschau.src =
    aktuellesFoto;

vorschau.style.display =
    "block";

}

catch (error) {

console.error(error);

alert(
    "Das Foto konnte nicht verarbeitet werden."
);

event.target.value = "";

}

}


/* ==============================
FOTO LÖSCHEN
============================== */

function fotoLoeschen() {

aktuellesFoto =
    null;


document
    .getElementById(
        "etikettFoto"
    )
    .value =
    "";


const vorschau =
    document.getElementById(
        "fotoVorschau"
    );


vorschau.src =
    "";

vorschau.style.display =
    "none";

}


/* ==============================
BIER SPEICHERN
============================== */

async function bierSpeichern() {


const name =
    document
        .getElementById("biername")
        .value
        .trim();


if (name === "") {

alert(
    "Bitte einen Biernamen eingeben."
);

return;

}


const brauerei =
    document
        .getElementById("brauerei")
        .value
        .trim();


const alkohol =
    Number(
        document
            .getElementById("alkohol")
            .value
    );


const farbe =
    Number(
        document
            .getElementById("farbe")
            .value
    );


const etikett =
    Number(
        document
            .getElementById("etikett")
            .value
    );


const schaum =
    Number(
        document
            .getElementById("schaum")
            .value
    );


const geruch =
    Number(
        document
            .getElementById("geruch")
            .value
    );


const sueffigkeit =
    Number(
        document
            .getElementById("sueffigkeit")
            .value
    );


const geschmack =
    Number(
        document
            .getElementById("geschmack")
            .value
    );


const notizen =
    document
        .getElementById("notizen")
        .value
        .trim();


const gesamt =
    farbe +
    etikett +
    schaum +
    geruch +
    sueffigkeit +
    geschmack;


const bier = {

name:
    name,

brauerei:
    brauerei,

alkohol:
    alkohol,

farbe:
    farbe,

etikett:
    etikett,

schaum:
    schaum,

geruch:
    geruch,

sueffigkeit:
    sueffigkeit,

geschmack:
    geschmack,

gesamt:
    gesamt,

notizen:
    notizen,

foto:
    aktuellesFoto || null

};


try {


if (
    bearbeitungsIndex === -1
) {


bier.erstelltAm =
    Date.now();


await window.firebaseAddDoc(
    bierSammlung(),
    bier
);


}

else {


const bierId =
    biere[
        bearbeitungsIndex
    ].id;


const bierDokument =
    window.firebaseDoc(

        window.firebaseDB,

        "users",

        aktuellerBenutzer.uid,

        "biere",

        bierId

    );


await window.firebaseUpdateDoc(

    bierDokument,

    bier

);


bearbeitungsIndex =
    -1;


document
    .getElementById(
        "formularTitel"
    )
    .innerText =
    "Neues Bier bewerten";


document
    .getElementById(
        "abbrechenButton"
    )
    .style.display =
    "none";

}


formularLeeren();

await ladeBiere();


}

catch (error) {

console.error(error);

alert(
    "Das Bier konnte nicht gespeichert werden.\n\n" +
    error.message
);

}

}


/* ==============================
LISTE FILTERN UND SORTIEREN
============================== */

function listeFiltern() {


const suchbegriff =
    document
        .getElementById(
            "suchfeld"
        )
        .value
        .trim()
        .toLowerCase();


const sortierung =
    document
        .getElementById(
            "sortierung"
        )
        .value;


let ergebnis =
    biere.filter(
        bier => {

            const name =
                (
                    bier.name ||
                    ""
                ).toLowerCase();


            const brauerei =
                (
                    bier.brauerei ||
                    ""
                ).toLowerCase();


            return (
                name.includes(
                    suchbegriff
                ) ||
                brauerei.includes(
                    suchbegriff
                )
            );

        }
    );


if (
    sortierung ===
    "beste"
) {

ergebnis.sort(
    (a, b) =>
        (b.gesamt || 0) -
        (a.gesamt || 0)
);

}


else if (
    sortierung ===
    "schlechteste"
) {

ergebnis.sort(
    (a, b) =>
        (a.gesamt || 0) -
        (b.gesamt || 0)
);

}


else if (
    sortierung ===
    "nameAZ"
) {

ergebnis.sort(
    (a, b) =>
        (a.name || "")
            .localeCompare(
                b.name || "",
                "de"
            )
);

}


else if (
    sortierung ===
    "nameZA"
) {

ergebnis.sort(
    (a, b) =>
        (b.name || "")
            .localeCompare(
                a.name || "",
                "de"
            )
);

}


anzeigen(
    ergebnis
);

}


/* ==============================
ANZEIGEN
============================== */

function anzeigen(liste = biere) {


const tbody =
    document
        .getElementById(
            "bierliste"
        );


tbody.innerHTML =
    "";


liste.forEach(
    (bier) => {


        const originalIndex =
            biere.indexOf(
                bier
            );


        const zeile =
            document.createElement(
                "tr"
            );


        let fotoHTML =
            '<span class="keinFoto">kein Foto</span>';


        if (
            bier.foto
        ) {

            fotoHTML = `

                <img
                    src="${bier.foto}"
                    class="etikettFoto"
                    alt="Etikett"
                    onclick="fotoOeffnen('${bier.foto}')"
                >

            `;

        }


        zeile.innerHTML = `

            <td>
                ${originalIndex + 1}
            </td>

            <td>
                ${escapeHTML(bier.name || "")}
            </td>

            <td>
                ${escapeHTML(bier.brauerei || "")}
            </td>

            <td>
                ${
                    bier.alkohol !== undefined
                    ? bier.alkohol + " %"
                    : ""
                }
            </td>

            <td>
                ${bier.etikett ?? ""}
            </td>

            <td>
                ${fotoHTML}
            </td>

            <td>
                ${bier.farbe ?? ""}
            </td>

            <td>
                ${bier.schaum ?? ""}
            </td>

            <td>
                ${bier.geruch ?? ""}
            </td>

            <td>
                ${bier.sueffigkeit ?? ""}
            </td>

            <td>
                ${bier.geschmack ?? ""}
            </td>

            <td class="gesamt">
                ${bier.gesamt ?? ""}
            </td>

            <td>
                ${escapeHTML(bier.notizen || "")}
            </td>

            <td>

                <button
                    onclick="bierBearbeiten(${originalIndex})"
                >
                    ✏️
                </button>

                <button
                    onclick="bierLoeschen(${originalIndex})"
                >
                    🗑️
                </button>

            </td>

        `;


        tbody.appendChild(
            zeile
        );

    }
);


/* ==============================
SICHERHEIT FÜR TEXT
============================== */

function escapeHTML(text) {

return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

document

/*

*/

aktuellesFoto =

const vorschau =

if (aktuellesFoto) {

else {

    )

        "abbrechenButton"
    )
    .style.display =

    top: 0,
    behavior: "smooth"
});

}


/* ==============================
LÖSCHEN
============================== */

async function bierLoeschen(index) {


const bestaetigung =
    confirm(
        "Dieses Bier wirklich löschen?"
    );


if (!bestaetigung) {
    return;
}


try {


const bierId =
    biere[index].id;


const bierDokument =
    window.firebaseDoc(

        window.firebaseDB,

        "users",

        aktuellerBenutzer.uid,

        "biere",

        bierId

    );


await window.firebaseDeleteDoc(
    bierDokument
);


if (
    bearbeitungsIndex ===
    index
) {

abbrechenBearbeiten();

}


await ladeBiere();


}

catch (error) {

console.error(error);

alert(
    "Das Bier konnte nicht gelöscht werden."
);

}

}
